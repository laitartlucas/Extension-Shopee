<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; width: 320px; padding: 16px; margin: 0; }
  h2 { color: #ee4d2d; font-size: 15px; margin: 0 0 10px; }
  textarea { width: 100%; height: 60px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 12px; box-sizing: border-box; resize: none; margin-bottom: 8px; }
  #info { font-size: 12px; color: #555; background: #f5f5f5; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; display: none; }
  .btn { background: #ee4d2d; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 4px; }
  .btn:hover { background: #d4401e; }
  #msg { font-size: 12px; color: #2e7d32; margin-top: 8px; text-align: center; display: none; }
  #aviso { font-size: 12px; color: #c00; margin-top: 6px; display: none; }
</style>
</head>
<body>
<h2>🛒 Preencher Endereço Shopee</h2>
<textarea id="link-input" placeholder="Cole aqui o link do pedido da planilha..."></textarea>
<div id="info"></div>
<button class="btn" id="btn-preencher">⚡ Preencher Endereço</button>
<div id="msg">✅ Preenchendo o formulário...</div>
<div id="aviso"></div>
<script src="popup.js"></script>
</body>
</html>
